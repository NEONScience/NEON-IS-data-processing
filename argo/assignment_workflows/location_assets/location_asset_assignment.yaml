---
# Default workflow for assigning locations/assets to data days.
# The data is loaded to a shared volume.
# The assignment module processes whatever is in the volume.
# The final output is written to a bucket.
apiVersion: argoproj.io/v1alpha1
kind: WorkflowTemplate
metadata:
  name: location-asset-assignment
spec:
  entrypoint: main
  arguments:
    parameters:
      - name: run_date
        value: "{{=sprig.date('2006/01/02', workflow.creationTimestamp)}}"
      - name: date_begin
        value: "{{=sprig.date('2006-01-02', workflow.creationTimestamp)}}"
      - name: configuration
        value: location-asset-assignment-config
      - name: r_args_by_source_type
        valueFrom:
          configMapKeyRef:
            name: location-asset-assignment-config
            key: r_args_by_source_type
  templates:
    - name: main
      steps:
        - - name: run-step
            templateRef:
              name: location-group-assignment-template
              template: main
            arguments:
              parameters:
                - name: source_type
                  value: '{{item.key}}'
                - name: r_args
                  value: '{{item.value}}'
            withParam: '{{workflow.parameters.r_args_by_source_type}}'