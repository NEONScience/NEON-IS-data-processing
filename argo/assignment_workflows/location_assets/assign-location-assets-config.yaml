---
apiVersion: v1
kind: ConfigMap
metadata:
  name: assign-location-assets-config
  labels:
    workflows.argoproj.io/configmap-type: Parameter
data:
  log_level: "DEBUG"
  # Git configuration.
  git_secret_name: "git-data-processing-metadata-key"
  git_secret_key: "ssh-private-key"
  git_repo_url: "git@github.com:BattelleEcology/data-processing-metadata.git"
  git_branch: "main"
  git_repo_dir: "location-assets"
  # Bucket for saving manifests.
  output_bucket: "neon-dev-argo-workflow-test"
  output_bucket_prefix: "assign_locations"
  # Path index for the source ID in the assignment output paths.
  source_id_path_index: "7"
  # R code
  relative_path_index: "3"
  parallelization_internal: "4"
  r_args_by_source_type.json: |
    {
      "default": "DirIn=$DIR_IN DirOut=$DIR_OUT DirErr=$ERR_PATH DateBgn=$DATE_BEGIN DateEnd=$DATE_END TypeFile=asset",
      "additions": {
        "aepg600m": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate'",
        "cmp22": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations|location_properties:LatTow|location_properties:LonTow'",
        "dualfan": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate'",
        "enviroscan": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations|locationMetadata:DistZaxsLvlMeasSoil|locationMetadata:LvlMeasSoil'",
        "lt400_hu24": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations'",
        "li191r": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate'",
        "metone370380": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|context'",
        "pluvio": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate'",
        "ptb330a": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations'",
        "pqs1": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|context'",
        "sunav2": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate'",
        "tchain": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations|ThermistorDepth501|ThermistorDepth502|ThermistorDepth503|ThermistorDepth504|ThermistorDepth505|ThermistorDepth506|ThermistorDepth507|ThermistorDepth508|ThermistorDepth509|ThermistorDepth510|ThermistorDepth511'",
        "troll": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations|context|location_properties:Coordinate uncertainty|location_properties:Coordinate source|location_properties:Elevation uncertainty|location_properties:Real world coordinate uncertainty|location_properties:Real world elevation uncertainty|location_properties:Survey horizontal uncertainty|location_properties:Survey vertical uncertainty|location_properties:Transformation RMSE'",
        "windobserverii": "'Prop=HOR|VER|install_date|remove_date|name|site|Data Rate|locations'"
      }
    }