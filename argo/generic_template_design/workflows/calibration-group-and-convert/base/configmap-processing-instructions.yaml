apiVersion: v1
kind: ConfigMap
metadata:
  name: calibration-group-convert-processing-instructions-config
  labels:
    workflows.argoproj.io/configmap-type: Parameter
data:
  processing-instructions.sh: |
    #!/bin/bash
    set -euo pipefail
    IFS=$'\n\t'

    # Determine if MANIFEST is a file path or JSON string
    if [ -f "$MANIFEST" ]; then
      json_data=$(cat "$MANIFEST")
    else
      json_data="$MANIFEST"
    fi

    # Run calibration assignment for each date in the manifest
    while IFS= read -r data_date; do
      export CAL_ASGN_DATE_BEGIN="$data_date"
  
      # Calculate next day (works with GNU date or macOS date)
      export CAL_ASGN_DATE_END=$(date -d "$data_date + 1 day" +%Y-%m-%d)
  
      echo "CAL_ASGN_DATE_BEGIN=$CAL_ASGN_DATE_BEGIN"
      echo "CAL_ASGN_DATE_END=$CAL_ASGN_DATE_END"
  
      eval "Rscript ./flow.cal.asgn.R $CAL_ASGN_R_ARGS"

    done < <(echo "$json_data" | jq -r '.[] | .data_date')

    # Join files from the archive and from Kafka
    export OUT_PATH=$OUT_PATH_JOINER
    python3 -m filter_joiner.filter_joiner_main

    # Combine data from Kafka and the archive
    eval "Rscript ./flow.kfka.comb.R $KFKA_COMB_R_ARGS"

    # Run calibration conversion module
    eval "Rscript ./flow.cal.conv.R $CAL_CONV_R_ARGS"

    # Create errored datum manifest
    python3 -m errored_file_manifest.errored_file_manifest_main