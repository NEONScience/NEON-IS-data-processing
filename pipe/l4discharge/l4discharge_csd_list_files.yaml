---
pipeline:
  name: l4discharge_csd_list_files
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-csd-loader:v1.0.0
  cmd: ["/bin/bash"]
  env:
    INGEST_BUCKET: neon-int-l4-discharge-proc
    GCS_ROOT_PREFIX: v2-dev
    CSD_FOLDER: csd_corrected
    OUT_PATH: /pfs/out
    LOG_LEVEL: INFO
  stdin:
  - "#!/bin/bash"
  - python3 -m csd_loader.csd_loader
input:
  pfs:
    repo: troll_cron_daily_and_date_control_tick
    glob: /(*-*)-*
    empty_files: true
parallelism_spec:
  constant: 1
autoscaling: false
resource_requests:
  memory: 256M
  cpu: 0.5
resource_limits:
  memory: 1G
  cpu: 1
sidecar_resource_requests:
  memory: 256M
  cpu: 0.2
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
