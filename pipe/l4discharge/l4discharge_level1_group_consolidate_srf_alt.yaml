---
pipeline:
  name: l4discharge_level1_group_consolidate_srf_alt
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-levl1-grp-cons-srf:sha-d3cbe61
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-scrict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'
    
    # Refresh interim directories with each datum (otherwise they persist and cause probs)
    rm -rf /tmp/filterjoined1
    rm -rf /tmp/filterjoined2
    rm -rf /tmp/consolidated
    rm -rf /tmp/pubtblsrf
    mkdir /tmp/filterjoined1
    mkdir /tmp/filterjoined2
    mkdir /tmp/consolidated
    mkdir /tmp/pubtblsrf

    # Set some environment variables for the first module
    export OUT_PATH=$OUT_PATH_1

    # Run first module - filter-joiner (using environment variables below as input parameters)
    python3 -m filter_joiner.filter_joiner_main

    # Set some environment variables for the second module
    export OUT_PATH=$OUT_PATH_2
    export CONFIG=$CONFIG2
    
    # Run second module - filter-joiner (using environment variables below as input parameters)
    python3 -m filter_joiner.filter_joiner_main

    # Clean up 1st interim directory (this is the only one we can clean up bc the rest use symlinks)
    rm -rf /tmp/filterjoined1 

    # Set some environment variables for the 3rd module
    export OUT_PATH=$OUT_PATH_3
    
    # Run third module - level 1 consolidate (using environment variables below as input parameters)
    python3 -m level1_consolidate.level1_consolidate_main 

    # Run fourth module - pub workbook loader (using environment variables below as input parameters)
    python3 -m pub_workbook_loader.pub_workbook_loader_main

    # Run fifth module - create pub tables and apply science review flags (if any)
    Rscript ./flow.pub.tabl.srf.R \
      DirIn=/tmp/consolidated \
      DirOut=/tmp/pubtblsrf \
      DirErr=/pfs/out/errored_datums \
      "DirData=data" \
      "AddTabl=csd_constantBiasShift_pub|csd_gapFillingRegression_pub|csd_dataGapToFillMethodMapping_pub|csd_gaugeWaterColumnRegression_pub|sdrc_gaugePressureRelationship_pub" \
      PathPubWb=$PUB_WORKBOOKS \
      "DirSubCopy=science_review_flags|group"

    # Set some environment variables for the 6th module - location filter joiner
    export OUT_PATH=$OUT_PATH_LOC
    export CONFIG=$CONFIG_LOC

    # Run sixth module - filter-joiner (using environment variables below as input parameters)
    python3 -m filter_joiner.filter_joiner_main

    # Move location metadata beside data and group. The location source is
    # grouped under surfacewater-physical_* while publication data is grouped
    # under l4discharge_*; filter-joiner preserves the source path.
    for location_path in "${OUT_PATH_LOC}"/*/*/*/*/surfacewater-*/location; do
      echo "Processing location path: ${location_path}"
      if [[ -d "${location_path}" ]]; then
        date_path="${location_path%/*/*/*}"
        l4discharge_paths=("${date_path}/${GROUP_PREFIX}_"*)
        if [[ ${#l4discharge_paths[@]} -eq 1 && -d "${l4discharge_paths[0]}" ]]; then
          l4discharge_path="${l4discharge_paths[0]}"
          echo "Moving location metadata for ${location_path} to ${l4discharge_path}/location"
          mv "${location_path}" "${l4discharge_path}/location"
          rmdir "${location_path%/*}" 2>/dev/null || true
        else
          echo "No ${GROUP_PREFIX}_* datum found for ${location_path}" >&2
        fi
      fi
    done

    # Export Level 1 data to bucket
    export OUT_PATH=/pfs/out
    linkdir=$(mktemp -d)
    shopt -s globstar
    out_parquet_glob="${OUT_PATH}/**/*.parquet"
    # Example: /2024/01/18/par-quantum-line_UKFS001000/data/par-quantum-line_UKFS001000_2024-01-18_PARQL_1min_001.parquet
    echo "Linking output files to ${linkdir}"
    #set -x # Echo commands to output for debugging
    datum_avg_int=""
    for f in $out_parquet_glob; do
      if [[ -f "$f" ]]; then
        candidate_fname="${f##*/}"
        if [[ "$candidate_fname" =~ ^${GROUP_PREFIX}_[A-Za-z0-9]+_[0-9]{4}-[0-9]{2}-[0-9]{2}_[A-Za-z0-9_]*_([0-9]+[A-Za-z]+)_[A-Za-z0-9]+\.parquet$ ]]; then
          datum_avg_int="${BASH_REMATCH[1]}"
          break
        fi
      fi
    done
    if [[ "${datum_avg_int}" ]]; then
      echo "Using averaging interval ${datum_avg_int} for files without an interval in their filename"
    fi
    fname=""
    for f in $out_parquet_glob; do
      if [[ -f "$f" ]]; then
        # Parse the path
        [[ "$f" =~ ^$OUT_PATH/([0-9]+)/([0-9]+)/([0-9]+)/(${GROUP_PREFIX}_[A-Za-z0-9]+)/data/(.*)$ ]]
        fyear="${BASH_REMATCH[1]}"
        fmonth="${BASH_REMATCH[2]}"
        fday="${BASH_REMATCH[3]}"
        fgroup="${BASH_REMATCH[4]}"
        fname="${BASH_REMATCH[5]}"
        # Get the averaging interval from the file name when present. Tables
        # without one use the interval discovered from another file in this datum.
        if [[ "$fname" =~ ^${GROUP_PREFIX}_[A-Za-z0-9]+_${fyear}-${fmonth}-${fday}_[A-Za-z0-9_]*_([0-9]+[A-Za-z]+)_[A-Za-z0-9]+\.parquet$ ]]; then
          avg_int="${BASH_REMATCH[1]}"
        elif [[ "$fname" =~ ^${GROUP_PREFIX}_[A-Za-z0-9]+_${fyear}-${fmonth}-${fday}_[A-Za-z0-9_]+\.parquet$ ]]; then
          if [[ "${datum_avg_int}" ]]; then
            avg_int="${datum_avg_int}"
          else
            echo "Skipping file because no averaging interval was found in this datum: ${fname}" >&2
            continue
          fi
        else
          echo "Skipping file with unexpected filename format: ${fname}" >&2
          continue
        fi
        #Form the output path and link
        outdir="${linkdir}/v2/${GROUP_PREFIX}/${avg_int}/group=${fgroup}/ms=${fyear}-${fmonth}"
        mkdir -p "${outdir}"
        ln -s "${f}" "${outdir}/${fname}"
      fi
    done
    #set +x
    if [[ "${fname}" ]]; then
      echo "Syncing files to bucket"
      rclone \
        --no-check-dest \
        --copy-links \
        --gcs-bucket-policy-only \
        --gcs-no-check-bucket \
        copy \
        "${linkdir}" \
        ":gcs://${BUCKET_NAME}"
      echo "Removing temporary files"
      rm -rf $linkdir
    fi

    EOF
  env:
    # Environment variables for 1st filter-joiner. Need to join by day again here because an outer join was used on 
    # these repos in order to pull them in with or without the SRF
    CONFIG: |
      ---
      # In Pachyderm root will be index 0, 'pfs' index 1, and the repo name index 2.
      # Metadata indices will typically begin at index 3.
      # Use unix-style glob pattern to select the desired directories in each repo 
      input_paths:
        - path:
            name: DATA_PATH
            # Filter for data directory
            glob_pattern: /pfs/DATA_PATH/*/*/*/*/**
            # Join on Y/M/D/group ID 
            join_indices: [3,4,5,6]
            outer_join: True
        - path:
            name: OS_DATA_PATH
            # Filter for data directory
            glob_pattern: /pfs/GROUP_PATH/*/*/*/*/data/*_pub*
            # Join on Y/M/D/group ID 
            join_indices: [3,4,5,6]
            outer_join: True
        - path:
            name: GROUP_PATH
            # Grab group information
            glob_pattern: /pfs/GROUP_PATH/*/*/*/*/group/**
            # Join on Y/M/D/group ID 
            join_indices: [3,4,5,6]
            outer_join: True
    OUT_PATH_1: /tmp/filterjoined1 # Transfered to OUT_PATH for the first module
    RELATIVE_PATH_INDEX: "3" # This is shared among the 2 filter joiners and consolidation module
    LINK_TYPE: COPY # options are COPY or SYMLINK. Use COPY for combined modules. Also shared with 2nd & 3rd modules 
    LOG_LEVEL: DEBUG # Shared among all modules
    
    # Below are the environment variables for 2nd filter-joiner bringing in the Science review flags 
    # Can't do this in first filter-joiner bc there are only data in the srf assignment
    # repo for groups that have applicable SRFs for the day. Need to pass through the
    # consolidated output with an outer join.
    CONFIG2: |
      ---
      # In Pachyderm root will be index 0, 'pfs' index 1, and the repo name index 2.
      # Metadata indices will typically begin at index 3.
      # Use unix-style glob pattern to select the desired directories in each repo 
      input_paths:
        - path:
            name: CONSOLIDATED_PATH
            # Filter for data directory
            glob_pattern: /tmp/filterjoined1/*/*/*/*/**
            # Join on group ID (already joined below by day)
            join_indices: [6]
            outer_join: True
        - path:
            name: SRF_PATH
            # Filter for data directory
            glob_pattern: /pfs/SRF_PATH/*/*/*/*/**
            # Join on group ID(already joined below by day)
            join_indices: [6]
    OUT_PATH_2: /tmp/filterjoined2 # This will be transfered to OUT_PATH for the this module

    # Environment variables for level 1 consolidation
    IN_PATH: /tmp/filterjoined2
    OUT_PATH_3: /tmp/consolidated # This will be transfered to OUT_PATH for the second module
    GROUP_INDEX: "6" # path index of names of group-level metadata to include in the output
    GROUP_METADATA_INDEX: "7"
    GROUP_METADATA_NAMES: group,science_review_flags
    # path index of names of directories to include in the output
    DATA_TYPE_INDEX: "7"
    DATA_TYPE_NAMES: data

    # Below are the environment variables for the location filter-joiner 
    OUT_PATH_LOC: /pfs/out # This will be transfered to OUT_PATH for the location filter-joiner module
    CONFIG_LOC: |
      ---
      # In Pachyderm root will be index 0, 'pfs' index 1, and the repo name index 2.
      # Metadata indices will typically begin at index 3.
      # Use unix-style glob pattern to select the desired directories in each repo 
      input_paths:
        - path:
            name: L1_PATH
            # Filter for data directory
            glob_pattern: /tmp/pubtblsrf/*/*/*/*/**
            # Join on group ID (already joined below by day)
            join_indices: [6]
            outer_join: True
        - path:
            name: LOCATION_PATH
            # Grab group information
            glob_pattern: /pfs/GROUP_PATH/*/*/*/*/*/location/**
            # Join on Y/M/D/group ID 
            join_indices: [3,4,5,6]
            outer_join: True

    # Environment variables for pub_workbook_loader
    OUT_PATH_WORKBOOK: /tmp/pub_workbooks
    PRODUCTS: NEON.DOM.SITE.DP4.00130.001 # Format: NEON.DOM.SITE.DPX.XXXXX.XXX,NEON.DOM.SITE.DPX.XXXXX.XXX,etc
  
    # Environment variables for pub table and srf module
    PUB_WORKBOOKS: /tmp/pub_workbooks
    PARALLELIZATION_INTERNAL: '2'

    # Environment variables for the L1 archiver
    GROUP_PREFIX: l4discharge # no ending "_"

  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
  - name: l1-bucket
    env_var: BUCKET_NAME
    key: L1_BUCKET

input:
  join:
  - pfs:
      name: DATA_PATH
      repo: l4discharge_predict
      glob: /(*/*/*)
      joinOn: $1
      outer_join: true 
      empty_files: false # Make sure this is false for LINK_TYPE=COPY
  - pfs:
      name: GROUP_PATH
      repo: l4discharge_group_and_parse
      glob: /(*/*/*)
      joinOn: $1
      outer_join: true 
      empty_files: false # Make sure this is false for LINK_TYPE=COPY
  - pfs:
      name: SRF_PATH
      repo: l4discharge_srf_assignment
      glob: /(*/*/*)
      joinOn: $1
      empty_files: false # Make sure this is false for LINK_TYPE=COPY
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 1G
  cpu: 2.2
resource_limits:
  memory: 2G
  cpu: 3.5
sidecar_resource_requests:
  memory: 3G
  cpu: 0.5
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
