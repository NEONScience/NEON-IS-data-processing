---
# Release-window L1 consolidate for tempSoil (_rel).
# Coexists alongside production tempSoil_level1_group_consolidate_srf.
# Processes the 2016-01-01 -> 2026-06-30 window; production handles Jul 2026 -> present.
#
# Reads pre-L1 inputs (qm, stats, group_path) from GCS - the L1 bucket under the
# pre-l1/ prefix, populated by the earlier "first pass on PROD" runs
# (tempSoil_stats_group_and_compute_gcs, tempSoil_qm_group_and_compute_gcs,
# tempSoil_group_path_gcs). Same transform shape as production; the only
# difference is STEP 0 (GCS hydration) replaces production's Pachyderm input
# hydration.
#
# Join semantics match production: outer_join on the cron_daily leg
# (import_trigger) so every day in the release window fires whether or not an
# SRF exists. Full L1 parquet lands in /pfs/out and rclones to the L1 bucket
# (STEP 6), so downstream pub_group_rel reads from Pachyderm just like prod's
# pub_group reads from tempSoil_level1_group_consolidate_srf.
pipeline:
  name: tempSoil_level1_group_consolidate_srf_rel
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-levl1-grp-cons-srf:v2.2.5
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    set -euo pipefail
    IFS=$'\n\t'

    # Hydrated inputs land under /tmp/qm, /tmp/stats, /tmp/group with two
    # leading path segments (tmp/<repo>) so RELATIVE_PATH_INDEX=3 puts YYYY
    # at index 3 - matching how the production pipe reads /pfs/QM/YYYY/...
    rm -rf /tmp/interimA /tmp/interimB /tmp/pfs/interimC /tmp/qm /tmp/stats /tmp/group
    mkdir -p /tmp/interimA /tmp/interimB /tmp/pfs/interimC /tmp/qm /tmp/stats /tmp/group

    # ---- STEP 0: Hydrate qm/stats/group from GCS for the datum's day ----
    # Iterate import_trigger (the _rel cron output, one entry per day in the
    # 2016 -> Jun 2026 window). SRF sparsity is handled at the join level, not
    # here - the transform still fires on days without SRFs so the L1 output
    # is complete across the whole window.
    for ymd_dir in /pfs/import_trigger/prt/*/*/*; do
      [[ -d "$ymd_dir" ]] || continue
      rel="${ymd_dir#/pfs/import_trigger/prt/}"
      echo "Hydrating GCS inputs for ${rel}"
      rclone --gcs-bucket-policy-only --gcs-no-check-bucket copy \
             ":gcs://${BUCKET_NAME}/pre-l1/tempSoil_qm_group_and_compute/${rel}" \
             "/tmp/qm/${rel}" || true
      rclone --gcs-bucket-policy-only --gcs-no-check-bucket copy \
             ":gcs://${BUCKET_NAME}/pre-l1/tempSoil_stats_group_and_compute/${rel}" \
             "/tmp/stats/${rel}" || true
      rclone --gcs-bucket-policy-only --gcs-no-check-bucket copy \
             ":gcs://${BUCKET_NAME}/pre-l1/tempSoil_group_path/${rel}" \
             "/tmp/group/${rel}" || true
    done

    if [[ -z "$(ls -A /tmp/qm 2>/dev/null)$(ls -A /tmp/stats 2>/dev/null)" ]]; then
      echo "No GCS inputs for the SRF datums in this run. Nothing to do."
      exit 0
    fi

    # ---- STEP 1: First filter-joiner - stats + qm + group by Y/M/D/group ----
    export OUT_PATH=$OUT_PATH_1
    python3 -m filter_joiner.filter_joiner_main

    # ---- STEP 2: Second filter-joiner - outer-join in the SRF assignments ----
    export OUT_PATH=$OUT_PATH_2
    export CONFIG=$CONFIG2
    python3 -m filter_joiner.filter_joiner_main
    rm -rf /tmp/interimA

    # ---- STEP 3: level1_consolidate -> consolidated-group tree ----
    export OUT_PATH=$OUT_PATH_3
    python3 -m level1_consolidate.level1_consolidate_main

    # ---- STEP 4: pub_workbook_loader ----
    python3 -m pub_workbook_loader.pub_workbook_loader_main

    # ---- STEP 5: pub tables + SRF apply (EXISTING R script) ----
    Rscript ./flow.pub.tabl.srf.R \
      DirIn=/tmp/pfs/interimC \
      DirOut=/pfs/out \
      DirErr=/pfs/out/errored_datums \
      "DirData=stats|quality_metrics" \
      PathPubWb=$PUB_WORKBOOKS \
      "DirSubCopy=science_review_flags|group|location"

    # ---- STEP 6: Export Level 1 data to L1 bucket (same as production) ----
    export OUT_PATH=/pfs/out
    linkdir=$(mktemp -d)
    shopt -s globstar
    out_parquet_glob="${OUT_PATH}/**/*.parquet"
    echo "Linking output files to ${linkdir}"
    fname=""
    for f in $out_parquet_glob; do
      if [[ -f "$f" ]]; then
        [[ "$f" =~ ^$OUT_PATH/([0-9]+)/([0-9]+)/([0-9]+)/(${GROUP_PREFIX}_[A-Za-z0-9]+)/data/(.*)$ ]]
        fyear="${BASH_REMATCH[1]}"
        fmonth="${BASH_REMATCH[2]}"
        fday="${BASH_REMATCH[3]}"
        fgroup="${BASH_REMATCH[4]}"
        fname="${BASH_REMATCH[5]}"
        [[ "$fname" =~ ^${GROUP_PREFIX}_[A-Za-z0-9]+_${fyear}-${fmonth}-${fday}_([A-Za-z0-9]+)_[A-Za-z0-9]+_[A-Za-z0-9]+_([A-Za-z0-9]+).parquet ]]
        avg_int="${BASH_REMATCH[2]}"
        outdir="${linkdir}/v2/${GROUP_PREFIX}/${avg_int}/group=${fgroup}/ms=${fyear}-${fmonth}"
        mkdir -p "${outdir}"
        ln -s "${f}" "${outdir}/${fname}"
      fi
    done
    if [[ "${fname}" ]]; then
      echo "Syncing files to bucket"
      rclone \
        --no-check-dest \
        --copy-links \
        --gcs-bucket-policy-only \
        --gcs-no-check-bucket \
        copy \
        "${linkdir}" \
        ":gcs://${BUCKET_NAME}"
      echo "Removing temporary files"
      rm -rf $linkdir
    fi
    EOF
  env:
    # First filter-joiner CONFIG - paths point at /tmp/{qm,stats,group} (hydrated
    # from GCS). Path segment layout matches production /pfs/... structure:
    #   /tmp(1)/qm(2)/YYYY(3)/MM(4)/DD(5)/group(6)/**  -> same indices as /pfs/QM/...
    CONFIG: |
      ---
      input_paths:
        - path:
            name: QUALITY_METRICS_PATH
            glob_pattern: /tmp/qm/*/*/*/*/**
            join_indices: [3,4,5,6]
        - path:
            name: STATISTICS_PATH
            glob_pattern: /tmp/stats/*/*/*/*/**
            join_indices: [3,4,5,6]
        - path:
            name: GROUP_PATH
            glob_pattern: /tmp/group/*/*/*/*/group/**
            join_indices: [3,4,5,6]
        - path:
            name: GROUP_PATH
            glob_pattern: /tmp/group/*/*/*/*/*/*/location/**
            join_indices: [3,4,5,6]
    OUT_PATH_1: /tmp/interimA
    RELATIVE_PATH_INDEX: "3"
    LINK_TYPE: COPY
    LOG_LEVEL: INFO

    # Second filter-joiner CONFIG - SRF still comes from /pfs/SRF_PATH (Pachyderm-resident).
    CONFIG2: |
      ---
      input_paths:
        - path:
            name: CONSOLIDATED_PATH
            glob_pattern: /tmp/interimA/*/*/*/*/**
            join_indices: [6]
            outer_join: True
        - path:
            name: SRF_PATH
            glob_pattern: /pfs/SRF_PATH/*/*/*/*/**
            join_indices: [6]
    OUT_PATH_2: /tmp/interimB

    IN_PATH: /tmp/interimB
    OUT_PATH_3: /tmp/pfs/interimC
    GROUP_INDEX: "6"
    GROUP_METADATA_INDEX: "7"
    GROUP_METADATA_NAMES: group,science_review_flags
    DATA_TYPE_INDEX: "9"
    DATA_TYPE_NAMES: location,stats,quality_metrics

    OUT_PATH_WORKBOOK: /tmp/pub_workbooks
    PRODUCTS: NEON.DOM.SITE.DP1.00041.001
    PUB_WORKBOOKS: /tmp/pub_workbooks
    PARALLELIZATION_INTERNAL: '2'
    GROUP_PREFIX: temp-soil

  # Only the L1 bucket secret is needed - pre-l1/ input hydration reads from
  # the same bucket as the v2/ pub output.
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
  - name: l1-bucket
    env_var: BUCKET_NAME
    key: L1_BUCKET

input:
  join:
  - pfs:
      name: import_trigger
      repo: tempSoil_cron_daily_and_date_control_rel
      glob: /prt/(*/*/*)
      joinOn: $1
      outer_join: true # Every cron day fires with or without SRFs
  - pfs:
      name: SRF_PATH
      repo: tempSoil_srf_assignment_rel
      glob: /(*/*/*)
      joinOn: $1
      empty_files: false

output_branch: master
parallelism_spec:
  constant: 20
autoscaling: true
resource_requests:
  memory: 4G
  cpu: 2
resource_limits:
  memory: 5.5G
  cpu: 2.5
sidecar_resource_requests:
  memory: 3G
  cpu: 1
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class-no-spot
