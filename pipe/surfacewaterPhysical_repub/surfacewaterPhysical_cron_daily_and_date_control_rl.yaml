---
# Independent release-window driver; retains source-specific site lists and year-file layout.
pipeline:
  name: surfacewaterPhysical_cron_daily_and_date_control_rl
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-date-cntl:v2.0.1
  env:
    # START_DATE ("YYYY-MM-DD") and END_DATE ("YYYY-MM-DD") indicate the max date range (inclusive) to create the /Y/M/D folder structure
    # If START_DATE is not set (remove line entirely to unset), the start_date and/or the kafka_start_date for each site will be used, as indicated in the site-list json file
    # END_DATE can be set or unset (remove line entirely to unset). If unset, end date will be LAG_DAYS_END ago. 
    LAG_DAYS_END: "2" # Default is 2. Don't go lower than 2.
    START_DATE: "2016-03-01" # Inclusive
    END_DATE: "2017-05-31" # Inclusive
    OUT_PATH: /pfs/out
    SOURCE_TYPE_AQUATROLL: "aquatroll200"
    SOURCE_TYPE_LEVELTROLL: "leveltroll500"
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-scrict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'
    
    # AQUATROLL
    export SOURCE_TYPE=$SOURCE_TYPE_AQUATROLL
    python3 -m cron_daily_and_date_control.cron_daily_and_date_control_main
    
    # LEVELTROLL
    export SOURCE_TYPE=$SOURCE_TYPE_LEVELTROLL
    python3 -m cron_daily_and_date_control.cron_daily_and_date_control_main
    

    # Collapse sensor/source dates to one release trigger per day.
    for day_dir in /pfs/out/aquatroll200/*/*/* /pfs/out/leveltroll500/*/*/*; do
      [[ -d "$day_dir" ]] || continue
      day="${day_dir##*/}"
      month_dir="${day_dir%/*}"
      month="${month_dir##*/}"
      year_dir="${month_dir%/*}"
      year="${year_dir##*/}"
      mkdir -p "/pfs/out/release/${year}/${month}/${day}"
      printf "%s\n" "${year}-${month}-${day}" > "/pfs/out/release/${year}/${month}/${day}/trigger"
    done
    tick_str=$(date -u +%Y-%m-%dT%H:%M:%SZ)
    mkdir -p /pfs/out/tick
    printf "%s\n" "$tick_str" > "/pfs/out/tick/$tick_str"
    EOF
input:
  cross:
  - cron:
      name: tick
      spec: '@never'
      overwrite: true
  - pfs:
      name: SITE_FILE
      repo: troll_site_list
      glob: /site-list.json
resource_requests:
  memory: 500M
  cpu: 1
resource_limits:
  memory: 800M
  cpu: 1.5
sidecar_resource_requests:
  memory: 2G
  cpu: 0.2
autoscaling: true
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class-no-spot
