---
pipeline:
  name: exo2_logjam_load_clean_assign
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-exo2-logs-load-clean-assign:sha-7bfebce
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-strict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'
    
    # Refresh interim directories with each datum (otherwise they persist and cause probs)
    rm -r -f /tmp/pfs/interim
    mkdir -p /tmp/pfs/interim
    
    # Run first module - logjam loader (using environment variables below as input parameters)
    python3 -m logjam_loader.load_all_logjam_files
        
    #run cleaning script
    Rscript ./flow.exo2.logfiles.R \
      DirIn=/tmp/pfs/interim \
      DirOutBase=/pfs/out \
      DirErr=/pfs/out/errored_datums \
      "SchmExo2=$SCHEMA_EXO2" \
      "SchmCond=$SCHEMA_COND" \
      "SchmDO=$SCHEMA_DO" \
      "SchmPh=$SCHEMA_PH" \
      "SchmTurb=$SCHEMA_TURB" \
      "SchmFdom=$SCHEMA_FDOM" \
      "SchmChl=$SCHEMA_CHL"
    
    EOF
  env:
    # Environment variables for logjam loader 
    LOGJAM_INGEST_BUCKET: neon-nonprod-is-logjam-ingest
    OUT_PATH: /tmp/pfs/interim
    LOG_LEVEL: DEBUG
    STARTING_PATH_INDEX: "7"
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
input:
  cross:
  - pfs:
      name: IN_PATH
      repo: exo2_logjam_list_files
      glob: /*/*/*/logjam_dev/exo2/
      empty_files: true
  - pfs:
      name: SCHEMA_EXO2
      repo: exo2_avro_schemas
      glob: /exo2/exo2_log_data.avsc
  - pfs:
      name: SCHEMA_COND
      repo: exo2_avro_schemas
      glob: /exo2conductivity/exo2conductivity_log_data.avsc
  - pfs:
      name: SCHEMA_DO
      repo: exo2_avro_schemas
      glob: /exo2dissolvedoxygen/exo2dissolvedoxygen_log_data.avsc
  - pfs:
      name: SCHEMA_PH
      repo: exo2_avro_schemas
      glob: /exo2phorp/exo2phorp_log_data.avsc
  - pfs:
      name: SCHEMA_TURB
      repo: exo2_avro_schemas
      glob: /exo2turbidity/exo2turbidity_log_data.avsc
  - pfs:
      name: SCHEMA_FDOM
      repo: exo2_avro_schemas
      glob: /exo2fdom/exo2fdom_log_data.avsc
  - pfs:
      name: SCHEMA_CHL
      repo: exo2_avro_schemas
      glob: /exo2algae/exo2algae_log_data.avsc
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 2G
  cpu: 3.3
resource_limits:
  memory: 3G
  cpu: 4.5
sidecar_resource_requests:
  memory: 4G
  cpu: 2
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
