---
pipeline:
  name: exo2_calibration_loader 
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-cval-loader:sha-3b6ff73
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-scrict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'
    
    python3 -m calval_loader.load_all_calval_files
    
    EOF
  env:
    CVAL_INGEST_BUCKET: neon-cval
    OUT_PATH: /pfs/out
    LOG_LEVEL: DEBUG
    SOURCE_TYPES: exo2,exo2conductivity,exo2turbidity,exo2fdom,exo2phorp,exo2dissolvedoxygen,exo2algae,exo,exoconductivity,exoturbidity,exofdom,exophorp,exodissolvedoxygen,exoalgae
    STARTING_PATH_INDEX: "5"
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
input:
  pfs:
    name: IN_PATH
    repo: exo2_calibration_list_files
    glob: /*/*/*/*
    empty_files: true
parallelism_spec:
  constant: 10
autoscaling: true
resource_requests:
  memory: 5G
  cpu: 2.5
resource_limits:
  memory: 6G
  cpu: 4
sidecar_resource_requests:
  memory: 3G
  cpu: 0.3
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
