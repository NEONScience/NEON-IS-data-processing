---
pipeline:
  name: exo2_fill_log_files
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-sunav2-logs-group-fill:v1.1.3
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-strict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'
    
    # Refresh interim directories with each datum (otherwise they persist and cause probs)
    #rm -rf /tmp/pfs/join_sources
    mkdir -p $OUT_PATH_JOIN_SOURCES # Filter joiner relies on the same path positions among inputs (i.e. repo name in 2nd position)
    
    
    # Run filter-joiner module to merge all data sources
    echo "Running filter-joiner to merge all data sources"
    export OUT_PATH=$OUT_PATH_JOIN_SOURCES
    python3 -m filter_joiner.filter_joiner_main   
      
    EOF
  env:
    # Environment variables for filter-joiner.
    CONFIG: |
      ---
      # Configuration for filter-joiner module that will bring together L0 sources of data
      # In Pachyderm root will be index 0, 'pfs' index 1, and the repo name index 2.
      # Metadata indices will typically begin at index 3.
      input_paths:
        - path:
            name: DATA_PATH_LOG
            glob_pattern: /pfs/DATA_PATH_LOG/*/*/*/**
            join_indices: [3,4,5,6]
            outer_join: true
        - path:
            name: DATA_PATH_STREAM
            glob_pattern: /pfs/DATA_PATH_STREAM/*/*/*/**
            join_indices: [3,4,5,6]
            outer_join: true
    
    OUT_PATH_JOIN_SOURCES: /pfs/out #/tmp/pfs/join_sources # Note that R modules use "pfs" in the path structure to determine datums
    LOG_LEVEL: DEBUG
    RELATIVE_PATH_INDEX: "3" # Must be consistent across inputs 
    LINK_TYPE: COPY # options are COPY or SYMLINK. MUST BE SIMLINK IF USING COMBINED MODULE.
input:
  cross:
  - join:
    - pfs:
        name: DATA_PATH_LOG
        repo: exo2_regularize_log_data
        glob: /(*/*/*/*) #sensor/Y/M/D
        joinOn: $1
        empty_files: false # Make sure this is false for LINK_TYPE=COPY
        outer_join: true
    - pfs:
        name: DATA_PATH_STREAM
        repo: exo2_regularize_stream_data
        glob: /(*/*/*/*) #sensor/Y/M/D
        joinOn: $1
        empty_files: false # Make sure this is false for LINK_TYPE=COPY
        outer_join: true
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 1G
  cpu: 1.5
resource_limits:
  memory: 2G
  cpu: 2
sidecar_resource_requests:
  memory: 2G
  cpu: 0.3
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
