---
pipeline:
  name: windBuoy_qm_group_and_compute
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-qaqc-qm-grp:v2.1.5
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-scrict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'

    # Refresh interim directories with each datum (otherwise they persist and cause probs)
    rm -r -f /tmp/pfs/filter_joined
    mkdir -p /tmp/pfs/filter_joined
    
    # Run first module - filter-joiner (using environment variables below as input parameters)
    python3 -m filter_joiner.filter_joiner_main

    #---- Run module - quality metrics (averaged) ----
    Rscript ./flow.qaqc.qm.R \
      DirIn=/tmp/pfs/filter_joined \
      DirOut=/pfs/out \
      DirErr=/pfs/out/errored_datums \
      "WndwAgr=002|030" \
      "WghtAlphBeta=2|1" \
      Thsh=0.2 \
      FileSchmQm=$FILE_SCHEMA_QM \
      "GrpQfAlph1=speed:speedNullQF|speedGapQF|speedRangeQF|speedPersistenceQF" \
      "GrpQfBeta1=speed:speedNullQF|speedGapQF|speedRangeQF|speedPersistenceQF"  \
      "GrpQfAlph2=direction:directionNullQF|directionGapQF|directionRangeQF|directionPersistenceQF|buoyCompNullQF|buoyCompGapQF|buoyCompRangeQF|buoyCompPersistenceQF|buoyWindDirCalmWindQF" \
      "GrpQfBeta2=direction:directionNullQF|directionGapQF|directionRangeQF|directionPersistenceQF|buoyCompNullQF|buoyCompGapQF|buoyCompRangeQF|buoyCompPersistenceQF|buoyWindDirCalmWindQF"
    EOF
  env:
    # Environment variables for filter-joiner
    CONFIG: |
      ---
      # In Pachyderm root will be index 0, 'pfs' index 1, and the repo name index 2.
      # Metadata indices will typically begin at index 3.
      # Use unix-style glob pattern to select the desired directories in each repo 
      input_paths:
        - path:
            name: QAQC_PLAUSIBILITY_PATH
            # Filter for flags directory
            glob_pattern: /pfs/QAQC_PLAUSIBILITY_PATH/*/*/*/*/rmyoung/*/flags/**
            # Join on named location (already joined below by day)
            join_indices: [6]
        - path:
            name: REGULARIZED_FLAGS_PATH
            # Filter for flags directory
            glob_pattern: /pfs/REGULARIZED_FLAGS_PATH/*/*/*/*/rmyoung/*/flags/**
            # Join on named location (already joined below by day
            join_indices: [6]
    OUT_PATH: /tmp/pfs/filter_joined
    LOG_LEVEL: INFO
    RELATIVE_PATH_INDEX: "3"
    LINK_TYPE: COPY # options are COPY or SYMLINK. Use COPY for combined modules.
    PARALLELIZATION_INTERNAL: '1' # Option for quality metrics module
input:
# We're going to send in all the data at once and partition out the aquatroll vs. leveltroll data using the
# filter-joiner.  
  cross:
  - pfs:
      name: FILE_SCHEMA_QM
      repo: windBuoy_avro_schemas
      glob: /windBuoy/windBuoy_quality_metrics.avsc
  - join:
    - pfs:
        name: QAQC_PLAUSIBILITY_PATH
        repo: windBuoy_analyze_pad_and_qaqc_plau
        glob: /(*/(*)/(*)
        joinOn: $1/$2/$3
        empty_files: false # Make sure this is false for LINK_TYPE=COPY
    - pfs:
        name: REGULARIZED_FLAGS_PATH
        repo: windBuoy_group_path
        glob: /(*/(*)/(*)
        joinOn: $1/$2/$3
        empty_files: false # Make sure this is false for LINK_TYPE=COPY
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 500M
  cpu: 1.2
resource_limits:
  memory: 1G
  cpu: 2
sidecar_resource_requests:
  memory: 1G
  cpu: 0.3
datum_set_spec:
  number: 10
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
