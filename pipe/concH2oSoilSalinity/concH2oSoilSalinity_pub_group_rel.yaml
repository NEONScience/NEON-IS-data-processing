---
# _rel variant of concH2oSoilSalinity_pub_group. Same transform and env as
# production - just reads from concH2oSoilSalinity_level1_group_cons_srf_rel
# and joins with concH2oSoilSalinity_cron_monthly_and_pub_rel.
pipeline:
  name: concH2oSoilSalinity_pub_group_rel
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-pub-grp-pack:v4.3.0
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - '# Run first module - pub_grouper (using environment variables below as input parameters)'
  - python3 -m pub_grouper.pub_grouper_main
  env:
    # Environment variables for 1st module: pub_grouper.
    LOG_LEVEL: INFO
    OUT_PATH: "/pfs/out"
    # ERR_PATH can be changed, it is user specified
    ERR_PATH_GROUPER: "pfs/out/errored_datums"
    YEAR_INDEX: '3' # Also shared with pub_transform
    GROUP_INDEX: '6'
    DATA_TYPE_INDEX: '7' # Also shared with pub_transform
    GROUP_METADATA_DIR: group
    PUBLOC_KEY: site
    LINK_TYPE: SYMLINK

input:
  join:
  - pfs:
      name: DATA_PATH
      repo: concH2oSoilSalinity_level1_group_cons_srf_rel
      # Glob should be monthly and joined with pub_control to hold pub until month is likely complete
      glob: /(*/*)
      joinOn: $1
  - pfs:
      repo: concH2oSoilSalinity_cron_monthly_and_pub_rel
      glob: /(*/*)
      joinOn: $1
      empty_files: true
parallelism_spec:
  constant: 2
autoscaling: true
resource_requests:
  memory: 700M
  cpu: 1
resource_limits:
  memory: 1.5G
  cpu: 1.8
sidecar_resource_requests:
  memory: 2G
  cpu: 0.3
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class-no-spot
