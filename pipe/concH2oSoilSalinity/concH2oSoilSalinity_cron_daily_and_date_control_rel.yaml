---
# concH2oSoilSalinity-specific cron for the _rel chain. Lives under the
# concH2oSoilSalinity release pipeline rather than piggybacking on enviroscan's
# cron so the whole _rel chain is self-contained. SOURCE_TYPE stays
# "enviroscan" because that's still the sensor source type the L1 chain looks
# for under /pfs/import_trigger/enviroscan/...
#
# Enumerates the full release-window date range (2016-01-01 -> 2026-06-30) for
# the release-window mini pipeline that pulls pre-L1 data from GCS and produces
# L1 output for the concH2oSoilSalinity data release (July 2025 - June 2026
# provisional data, plus historic-data SRF flagging back to 2016).
#
# Independent of enviroscan_ingest_days: driven by a plain daily cron because
# the release chain reads pre-L1 from GCS, not raw ingest. Production and _rel
# process disjoint date ranges so they run side-by-side.
pipeline:
  name: concH2oSoilSalinity_cron_daily_and_date_control_rel
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-date-cntl:v2.0.1
  cmd: ["/bin/bash"]
  env:
    # Dev demo: narrowed to June 2026 (all of June is in the dev pre-l1 GCS bucket).
    # For the real release-window run, widen to START_DATE: "2016-01-01".
    OUT_PATH: /pfs/out
    START_DATE: "2026-06-01"
    END_DATE: "2026-06-30"
    SOURCE_TYPE: "enviroscan"
  stdin:
  - "#!/bin/bash"
  - set -euo pipefail
  - python3 -m cron_daily_and_date_control.cron_daily_and_date_control_main
  # Emit a fresh /tick/<UTC-timestamp> file each run so downstream pipes
  # (srf_loader_rel) see a hash change on every cron tick and re-poll PDR.
  # Mirrors the /pfs/out/tick pattern that enviroscan_ingest_days uses in prod.
  - tick_str=$(date -u +%Y-%m-%dT%H:%M:%SZ)
  - mkdir -p /pfs/out/tick
  - echo "$tick_str" > "/pfs/out/tick/$tick_str"
input:
  # No dep on enviroscan_ingest_days (that's what makes this the _rel
  # variant). Still needs SITE_FILE because cron_daily_and_date_control_main
  # reads site-list.json to enumerate sites. Cross with the cron tick so
  # any tick fires the pipe.
  cross:
  - cron:
      name: tick
      spec: "@never"
      #spec: "0 0 * * *" # Run at 00:00 GMT daily
      overwrite: true
  - pfs:
      name: SITE_FILE
      repo: enviroscan_site_list
      glob: /site-list.json
resource_requests:
  memory: 500M
  cpu: 1
resource_limits:
  memory: 800M
  cpu: 1.5
sidecar_resource_requests:
  memory: 500M
  cpu: 0.5
autoscaling: true
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class-no-spot
