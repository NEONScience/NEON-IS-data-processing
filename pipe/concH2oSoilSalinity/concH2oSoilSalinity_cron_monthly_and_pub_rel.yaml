---
# _rel variant of concH2oSoilSalinity_cron_monthly_and_pub_control.
# Enumerates months across the full release window so the
# _rel pub chain re-publishes month-by-month for the whole release. Coexists
# alongside production which will only cover Jul 202N -> present.
pipeline:
  name: concH2oSoilSalinity_cron_monthly_and_pub_rel
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-pub-cntl:v1.1.0
  cmd: ["/bin/bash"]
  env:
    # Dev demo: narrowed to June 2026 only (matches _rel L1 window).
    # For the real release-window run, widen to START_MONTH: "2016-01".
    OUT_PATH: /pfs/out
    START_MONTH: "2026-06"
    END_MONTH: "2026-06"
  stdin:
  - "#!/bin/bash"
  - ./cron_monthly_and_pub_control/populate_pub_months.sh
input:
  cron:
    name: tick
    spec: "@never"
    #spec: "0 7 9 * *" # Run at 00:00 MST (07:00 GMT) on the 9th of the month
    overwrite: true
autoscaling: true
resource_requests:
  memory: 64M
  cpu: 0.1
resource_limits:
  memory: 200M
  cpu: 1
sidecar_resource_requests:
  memory: 200M
  cpu: 0.1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class-no-spot
