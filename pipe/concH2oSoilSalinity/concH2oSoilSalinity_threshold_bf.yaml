---
# _bf BACKFILL copy of concH2oSoilSalinity_threshold.yaml (pipeline concH2oSoilSalinity_threshold -> concH2oSoilSalinity_threshold_bf).
# Only pipeline name + upstream pipeline repo: refs differ. Cycled with
# utilities/vignettes/cycle_heavy_product_dag.sh ... _bf _bf - see
# utilities/vignettes/concH2oSoilSalinity_backfill_cycle.md
pipeline:
  name: concH2oSoilSalinity_threshold_bf
transform:
  # image_pull_secrets:
  # - battelleecology-quay-read-all-pull-secret
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-threshold-loader:v2.0.0
  cmd:
  - /bin/bash
  stdin:
  - '#!/bin/bash'
  - python3 -m threshold_loader.threshold_loader_main
  env:
    OUT_PATH: /pfs/out
    LOG_LEVEL: INFO
    TERM: VSICDepth01|VSICDepth02|VSICDepth03|VSICDepth04|VSICDepth05|VSICDepth06|VSICDepth07|VSICDepth08|VSWCfactoryDepth01|VSWCfactoryDepth02|VSWCfactoryDepth03|VSWCfactoryDepth04|VSWCfactoryDepth05|VSWCfactoryDepth06|VSWCfactoryDepth07|VSWCfactoryDepth08|VSWCsoilSpecificDepth01|VSWCsoilSpecificDepth02|VSWCsoilSpecificDepth03|VSWCsoilSpecificDepth04|VSWCsoilSpecificDepth05|VSWCsoilSpecificDepth06|VSWCsoilSpecificDepth07|VSWCsoilSpecificDepth08
    #if you are pulling multiple terms and they have different contexts, list them here numerically (CTXT_1, CTXT_2 etc). 
    CTXT_1: soil|ion-content
    CTXT_2: soil|water-content|factory
    CTXT_3: soil|water-content|soil-specific
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
input:
  pfs:
    repo: enviroscan_ingest_days_bf
    glob: /tick/
    branch: master
    empty_files: true
autoscaling: true
resource_requests:
  memory: 32M
  cpu: 0.05
resource_limits:
  memory: 200M
  cpu: 0.5
sidecar_resource_requests:
  memory: 120M
  cpu: 0.1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
