---
# Assign only selected months, not whole years. R's DateEnd is exclusive.
pipeline:
  name: cmp22_location_active_dates_assignment_release
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-loc-grp-asgn:v1.4.1
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - set -euo pipefail
  - month_path="${DATE_PATH##*/cmp22/}"
  - date_bgn="${month_path//\//-}-01"
  - date_end=$(date -u -d "$date_bgn +1 month" +%F)
  - |
    Rscript ./flow.loc.grp.asgn.R \
      DirIn="$DIR_IN" DirOut=/pfs/out \
      DirErr="/pfs/out/errored_datums/$month_path" \
      DateBgn="$date_bgn" DateEnd="$date_end" TypeFile=namedLocation \
      "Prop=HOR|VER|name|description|site|Data Rate|active_periods"
  env:
    LOG_LEVEL: INFO
input:
  cross:
  - pfs:
      name: DIR_IN
      repo: cmp22_location_loader_release
      glob: /cmp22/*
  - pfs:
      name: DATE_PATH
      repo: cmp22_cron_daily_and_date_control_release
      glob: /cmp22/*/*
      empty_files: true
parallelism_spec:
  constant: 2
autoscaling: true
resource_requests:
  memory: 210M
  cpu: 1.2
resource_limits:
  memory: 500M
  cpu: 1.6
sidecar_resource_requests:
  memory: 2G
  cpu: 0.3
datum_set_spec:
  number: 5
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
