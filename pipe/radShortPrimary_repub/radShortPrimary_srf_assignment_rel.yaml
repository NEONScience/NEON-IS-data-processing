---
# Release-window variant of radShortPrimary_srf_assignment; coexists with production.
pipeline:
  name: radShortPrimary_srf_assignment_rel
transform:
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - export ERR_PATH="/pfs/out/errored_datums$FILE_YEAR"
  - Rscript
      ./flow.srf.asgn.R
      DirIn=$DIR_IN
      DirOut=/pfs/out
      DirErr=$ERR_PATH
      FileYear=$FILE_YEAR
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-srf-asgn:v1.2.0
  # image_pull_secrets:
  # - battelleecology-quay-read-all-pull-secret
  env:
    LOG_LEVEL: INFO
input:
  cross:
  - pfs:
      name: DIR_IN
      repo: radShortPrimary_srf_loader_rel
      glob: /*
  - pfs:
      name: FILE_YEAR
      repo: radShortPrimary_cron_daily_and_date_control_rel
      glob: /data_year*.txt
parallelism_spec:
  constant: 2
autoscaling: true
resource_requests:
  memory: 200M
  cpu: 0.8
resource_limits:
  memory: 800M
  cpu: 1.5
sidecar_resource_requests:
  memory: 1G
  cpu: 0.2
datum_set_spec:
  number: 10
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
