---
# _bf BACKFILL copy of enviroscan_calibration_list_files.yaml (pipeline enviroscan_calibration_list_files -> enviroscan_calibration_list_files_bf).
# Only pipeline name + upstream pipeline repo: refs differ. Cycled with
# utilities/vignettes/cycle_heavy_product_dag.sh ... _bf _bf - see
# utilities/vignettes/concH2oSoilSalinity_backfill_cycle.md
pipeline:
  name: enviroscan_calibration_list_files_bf
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-cval-loader:v3.0.0
  cmd: ["/bin/bash"]
  env:
    CVAL_INGEST_BUCKET: neon-cval
    OUT_PATH: /pfs/out
  stdin:
  - "#!/bin/bash"
  - python3 -m calval_loader.calval_loader
input:
  pfs:
    repo: enviroscan_ingest_days_bf
    glob: /tick/
    branch: master
    empty_files: true
autoscaling: true
resource_requests:
  memory: 800M
  cpu: 0.4
resource_limits:
  memory: 1.2G
  cpu: 1.5
sidecar_resource_requests:
  memory: 1G
  cpu: 0.5
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
