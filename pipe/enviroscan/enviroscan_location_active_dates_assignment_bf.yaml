---
# _bf BACKFILL copy of enviroscan_location_active_dates_assignment.yaml (pipeline enviroscan_location_active_dates_assignment -> enviroscan_location_active_dates_assignment_bf).
# Only pipeline name + upstream pipeline repo: refs differ. Cycled with
# utilities/vignettes/cycle_heavy_product_dag.sh ... _bf _bf - see
# utilities/vignettes/concH2oSoilSalinity_backfill_cycle.md
pipeline:
  name: enviroscan_location_active_dates_assignment_bf
transform:
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - export ERR_PATH="/pfs/out/errored_datums$FILE_YEAR"
  - Rscript
      ./flow.loc.grp.asgn.R
      DirIn=$DIR_IN
      DirOut=/pfs/out
      DirErr=$ERR_PATH
      FileYear=$FILE_YEAR
      TypeFile=namedLocation
      "Prop=HOR|VER|name|description|site|Data Rate|active_periods"
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-loc-grp-asgn:v1.4.1
  # image_pull_secrets:
  # - battelleecology-quay-read-all-pull-secret
  env:
    LOG_LEVEL: INFO
input:
  cross:
  - pfs:
      name: DIR_IN
      repo: enviroscan_location_loader_bf
      glob: /enviroscan/*
  - pfs:
      name: FILE_YEAR
      repo: enviroscan_cron_daily_and_date_control_bf
      glob: /data_year*.txt
parallelism_spec:
  constant: 8
autoscaling: true
resource_requests:
  memory: 210M
  cpu: 1.2
resource_limits:
  memory: 500M
  cpu: 1.6
sidecar_resource_requests:
  memory: 2G
  cpu: 0.3
datum_set_spec:
  number: 5
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
