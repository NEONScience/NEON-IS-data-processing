---
# Reuse final tables as DirData=data. Existing SRFs may be reapplied unchanged;
# new records can flag/redact, but this cannot undo an earlier flag/redaction.
# No stats or quality-metrics recomputation is possible from the final archive.
pipeline:
  name: radShortPrimary_level1_group_consolidate_srf_release
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-levl1-grp-cons-srf:v2.4.0
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - set -euo pipefail
  - |
    work_dir=$(mktemp -d /tmp/radshort-release.XXXXXX)
    trap 'rm -rf "$work_dir"' EXIT
    mkdir -p "$work_dir/joined" "$work_dir/pfs/consolidated" \
      "$work_dir/pfs/result" "$work_dir/workbooks"
    # /tmp/radshort-release.XXXXXX/joined/YYYY puts YYYY at path index 4.
    export OUT_PATH="$work_dir/joined"
    python3 -m filter_joiner.filter_joiner_main
    export IN_PATH="$OUT_PATH"
    export OUT_PATH="$work_dir/pfs/consolidated"
    export RELATIVE_PATH_INDEX=4 GROUP_INDEX=7
    export GROUP_METADATA_INDEX=8 DATA_TYPE_INDEX=10
    python3 -m level1_consolidate.level1_consolidate_main

    export OUT_PATH_WORKBOOK="$work_dir/workbooks"
    python3 -m pub_workbook_loader.pub_workbook_loader_main
    Rscript ./flow.pub.tabl.srf.R \
      DirIn="$work_dir/pfs/consolidated" DirOut="$work_dir/pfs/result" \
      DirErr=/pfs/out/errored_datums "DirData=data" \
      PathPubWb="$OUT_PATH_WORKBOOK" \
      "DirSubCopy=science_review_flags|group|location"
    # Resolve metadata symlinks before the scratch tree is removed.
    cp -aL "$work_dir/pfs/result/." /pfs/out/

    # R flows route individual failures to errored_datums; do not archive a
    # successful-looking subset if a source table was dropped or failed.
    for file in /pfs/RELEASE_PATH/*/*/*/*/data/*.parquet; do
      relative="${file#/pfs/RELEASE_PATH/}"
      if [[ ! -f "/pfs/out/$relative" ]]; then
        echo "SRF processing did not produce archived table: $relative" >&2
        exit 1
      fi
    done

    linkdir="$work_dir/archive"
    shopt -s nullglob
    pattern='^([0-9]{4})/([0-9]{2})/([0-9]{2})/'
    pattern+="(${GROUP_PREFIX}_[A-Za-z0-9]+)/data/"
    pattern+='(.+_([A-Za-z0-9]+)\.parquet)$'
    for file in /pfs/out/*/*/*/*/data/*.parquet; do
      relative="${file#/pfs/out/}"
      if [[ ! "$relative" =~ $pattern ]]; then
        echo "Unexpected release L1 output path: $relative" >&2
        exit 1
      fi
      year="${BASH_REMATCH[1]}"
      month="${BASH_REMATCH[2]}"
      group="${BASH_REMATCH[4]}"
      filename="${BASH_REMATCH[5]}"
      interval="${BASH_REMATCH[6]}"
      destination="$linkdir/v2/$GROUP_PREFIX/$interval/group=$group/ms=$year-$month"
      mkdir -p "$destination"
      ln -s "$file" "$destination/$filename"
    done
    rclone --no-check-dest --copy-links --gcs-bucket-policy-only \
      --gcs-no-check-bucket copy "$linkdir" ":gcs://${BUCKET_NAME}"
  env:
    CONFIG: |
      ---
      input_paths:
        - path:
            name: RELEASE_PATH
            glob_pattern: /pfs/RELEASE_PATH/*/*/*/*/**
            join_indices: [3,4,5,6]
            outer_join: true
        - path:
            name: SRF_PATH
            glob_pattern: /pfs/SRF_PATH/*/*/*/*/science_review_flags/**
            join_indices: [3,4,5,6]
    RELATIVE_PATH_INDEX: "3"
    LINK_TYPE: COPY
    LOG_LEVEL: INFO
    # Preserve the already-consolidated data folder while flattening
    # GROUP/cmp22/LOCATION/location to GROUP/location.
    GROUP_METADATA_NAMES: group,science_review_flags,data
    DATA_TYPE_NAMES: location
    PRODUCTS: NEON.DOM.SITE.DP1.00022.001
    PARALLELIZATION_INTERNAL: '2'
    GROUP_PREFIX: rad-short-primary
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
  - name: l1-bucket
    env_var: BUCKET_NAME
    key: L1_BUCKET
input:
  join:
  - pfs:
      name: RELEASE_PATH
      repo: radShortPrimary_filter_joiner_release
      glob: /(*/*/*)
      joinOn: $1
      outer_join: true
      empty_files: false
  - pfs:
      name: SRF_PATH
      repo: radShortPrimary_srf_assignment_release
      glob: /(*/*/*)
      joinOn: $1
      empty_files: false
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 1G
  cpu: 2.2
resource_limits:
  memory: 2G
  cpu: 3.5
sidecar_resource_requests:
  memory: 3G
  cpu: 0.5
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
