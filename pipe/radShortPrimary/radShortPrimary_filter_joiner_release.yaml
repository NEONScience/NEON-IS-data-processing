---
# Match archived tables and fresh group/location metadata on Y/M/D/group.
# The PFS outer join lets the completeness check reject missing metadata.
pipeline:
  name: radShortPrimary_filter_joiner_release
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-levl1-grp-cons-srf:v2.4.0
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - set -euo pipefail
  - python3 -m filter_joiner.filter_joiner_main
  - |
    for file in /pfs/LEVEL1_PATH/*/*/*/*/data/*.parquet; do
      relative="${file#/pfs/LEVEL1_PATH/}"
      if [[ ! -f "/pfs/out/$relative" ]]; then
        echo "Missing group/location metadata for archived table: $relative" >&2
        exit 1
      fi
    done
  env:
    CONFIG: |
      ---
      input_paths:
        - path:
            name: LEVEL1_PATH
            glob_pattern: /pfs/LEVEL1_PATH/*/*/*/*/data/**
            join_indices: [3,4,5,6]
        - path:
            name: GROUP_PATH
            glob_pattern: /pfs/GROUP_PATH/*/*/*/*/group/**
            join_indices: [3,4,5,6]
        - path:
            name: GROUP_PATH
            glob_pattern: /pfs/GROUP_PATH/*/*/*/*/*/*/location/**
            join_indices: [3,4,5,6]
    OUT_PATH: /pfs/out
    RELATIVE_PATH_INDEX: "3"
    LINK_TYPE: COPY
    LOG_LEVEL: INFO
input:
  join:
  - pfs:
      name: LEVEL1_PATH
      repo: radShortPrimary_level1_reingest_release
      glob: /(*/*/*)
      joinOn: $1
      outer_join: true
      empty_files: false
  - pfs:
      name: GROUP_PATH
      repo: radShortPrimary_group_path_release
      glob: /(*/*/*)
      joinOn: $1
      empty_files: false
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 600M
  cpu: 0.5
resource_limits:
  memory: 2G
  cpu: 1.5
sidecar_resource_requests:
  memory: 3G
  cpu: 0.5
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
