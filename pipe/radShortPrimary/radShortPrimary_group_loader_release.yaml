---
pipeline:
  name: radShortPrimary_group_loader_release
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-group-loader:v1.0.0
  cmd: ["/bin/bash"]
  env:
    GROUP_PREFIX: rad-short-primary_
    LOG_LEVEL: INFO
    OUT_PATH: /pfs/out
    ERR_PATH: /pfs/out/errored_datums
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
  stdin:
  - "#!/bin/bash"
  - set -euo pipefail
  - python3 -m group_loader.group_loader_main
input:
  pfs:
    repo: cmp22_cron_daily_and_date_control_release
    glob: /tick/
    empty_files: true
autoscaling: true
resource_requests:
  memory: 50M
  cpu: 0.1
resource_limits:
  memory: 300M
  cpu: 1.5
sidecar_resource_requests:
  memory: 200M
  cpu: 0.2
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
