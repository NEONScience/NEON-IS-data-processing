---
# Same publication destinations and visibility synchronization as the regular
# publisher. This is a real republication, not an isolated staging destination.
pipeline:
  name: radShortPrimary_pub_egress_and_publish_release
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-pub-egrs-publ:v5.0.0
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    set -euo pipefail
    IFS=$'\n\t'

    curl --fail --show-error --location -o "$OUT_MDP_SITES" \
      https://raw.githubusercontent.com/NEONScience/NEON-IS-data-processing-inputs/refs/heads/main/mdp_sites_list.txt

    if [[ $(echo $DATA_PATH) ]]; then
      python3 -m pub_egress.pub_egress_main
    fi
    if ls $OUT_PATH/NEON.DOM.SITE* 1> /dev/null 2>&1; then
      for DIR in $OUT_PATH/NEON.DOM.SITE*; do
        echo "Syncing $DIR to bucket $BUCKET_NAME"
        [[ "$DIR" =~ ^$OUT_PATH/(.*)$ ]]
        PRODUCT="${BASH_REMATCH[1]}"
        rclone \
          --no-check-dest \
          --copy-links \
          --gcs-bucket-policy-only \
          --gcs-no-check-bucket \
          copy \
          "${OUT_PATH}/${PRODUCT}" \
          ":gcs://${BUCKET_NAME}/${PRODUCT}"
      done
    else
      echo "No pub output to egress"
    fi

    if ls $OUT_PATH_MDP/NEON.DOM.SITE* 1> /dev/null 2>&1; then
      for DIR in $OUT_PATH_MDP/NEON.DOM.SITE*; do
        [[ "$DIR" =~ ^$OUT_PATH_MDP/(.*)$ ]]
        PRODUCT="${BASH_REMATCH[1]}"
        for DIR_SUB in $DIR/MD*; do
          [[ "$DIR_SUB" =~ ^$DIR/(.*)$ ]]
          SITE="${BASH_REMATCH[1]}"
          BUCKET_NAME_MDP=""
          # Route each MDP site to its own configured destination.
          while IFS=$' \t' read -r mdpsite prod staging bucket_name; do
            if [[ "$SITE" == "$mdpsite" && "$prod" == "$PROD" &&
                  "$staging" == "$STAGING" ]]; then
              BUCKET_NAME_MDP="$bucket_name"
            fi
          done < "$OUT_MDP_SITES"
          if [[ -z "$BUCKET_NAME_MDP" ]]; then
            echo "No MDP bucket configured for $SITE" \
              "(PROD=$PROD, STAGING=$STAGING)" >&2
            exit 1
          fi
          rclone \
            --no-check-dest \
            --copy-links \
            --gcs-bucket-policy-only \
            --gcs-no-check-bucket \
            copy \
            "$DIR_SUB" \
            ":gcs://${BUCKET_NAME_MDP}/${PRODUCT}/${SITE}"
        done
      done
    else
      echo "No MDP pub output to egress"
    fi

    export DATA_PATH=$OUT_PATH
    python3 -m pub_uploader.pub_uploader_main
    python3 -m pub_sync.pub_sync_main
    EOF
  env:
    LOG_LEVEL: INFO
    OUT_PATH: "/pfs/out"
    OUT_PATH_MDP: "/pfs/out/mdp"
    OUT_MDP_SITES: "/tmp/mdp_sites.txt"
    ERR_PATH: /pfs/out/errored_datums
    STARTING_PATH_INDEX: "2"
    PROD: "false"
    STAGING: "true"
    VERSION: 'pachyderm_v1'
    CHANGE_BY: pachyderm
    DATE_PATH_YEAR_INDEX: "3"
    DATE_PATH_MONTH_INDEX: "4"
    DATA_PATH_PRODUCT_INDEX: "3"
    DATA_PATH_SITE_INDEX: "4"
    DATA_PATH_DATE_INDEX: "5"
    DATA_PATH_PACKAGE_INDEX: "6"
    PRODUCTS: NEON.DOM.SITE.DP1.00022.001
    SITES: "all"
  secrets:
  - name: pdr-secret
    mount_path: /var/db_secret
  - name: pub-bucket
    env_var: BUCKET_NAME
    key: BUCKET_NAME
  - name: pub-bucket
    env_var: EGRESS_URL
    key: EGRESS_URL
input:
  group:
  - join:
    - pfs:
        name: DATA_PATH
        repo: radShortPrimary_pub_format_and_package_release
        glob: /*/*/(*/*)
        joinOn: $1
        group_by: $1
    - pfs:
        name: DATE_PATH
        repo: radShortPrimary_cron_monthly_and_pub_control_release
        glob: /(*/*)
        joinOn: $1
        outer_join: true
        group_by: $1
        empty_files: true
autoscaling: true
resource_requests:
  memory: 500M
  cpu: 0.5
resource_limits:
  memory: 1G
  cpu: 1.3
sidecar_resource_requests:
  memory: 3G
  cpu: 1.3
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
