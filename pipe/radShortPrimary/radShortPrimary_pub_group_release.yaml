---
pipeline:
  name: radShortPrimary_pub_group_release
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-pub-grp-pack:v4.8.1
  cmd: ["/bin/bash"]
  stdin:
  - "#!/bin/bash"
  - set -euo pipefail
  - python3 -m pub_grouper.pub_grouper_main
  env:
    LOG_LEVEL: INFO
    OUT_PATH: /pfs/out
    ERR_PATH_GROUPER: /pfs/out/errored_datums
    YEAR_INDEX: '3'
    GROUP_INDEX: '6'
    DATA_TYPE_INDEX: '7'
    GROUP_METADATA_DIR: group
    PUBLOC_KEY: site
    LINK_TYPE: SYMLINK
input:
  join:
  - pfs:
      name: DATA_PATH
      repo: radShortPrimary_level1_group_consolidate_srf_release
      glob: /(*/*)
      joinOn: $1
  - pfs:
      repo: radShortPrimary_cron_monthly_and_pub_control_release
      glob: /(*/*)
      joinOn: $1
      empty_files: true
parallelism_spec:
  constant: 2
autoscaling: true
resource_requests:
  memory: 1.8G
  cpu: 1
resource_limits:
  memory: 2.5G
  cpu: 1.5
sidecar_resource_requests:
  memory: 4G
  cpu: 1
datum_set_spec:
  number: 1
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class
