---
pipeline:
  name: waterQuality_fdom_correct
transform:
  image: us-central1-docker.pkg.dev/neon-shared-service/neonscience/neon-is-waterquality-fdom-group-correct:sha-f7791ae
  cmd:
  - sh
  - "-c"
  - |-
    /bin/bash <<'EOF'
    # Use bash-scrict mode. See http://redsymbol.net/articles/unofficial-bash-strict-mode/
    set -euo pipefail
    IFS=$'\n\t'
    
    # Refresh interim directories with each datum (otherwise they persist and cause probs)
    rm -rf /tmp/filterjoined
    mkdir /tmp/filterjoined
    
    # Set some environment variables for the first module
    export OUT_PATH=$OUT_PATH_1

    # Run first module - filter-joiner (using environment variables below as input parameters). Join select sonde and suna tables.
    python3 -m filter_joiner.filter_joiner_main
    
    # Flatten sunav2 structure by moving sunav2 from nitrate-surfacewater_* to water-quality_* level
    for nitrate_folder in /pfs/out/*/*/*/*/nitrate-surfacewater_*/; do
      if [ -d "$nitrate_folder" ]; then
        parent_dir=$(dirname "$nitrate_folder")
        if [ -d "$nitrate_folder/sunav2" ]; then
          mv "$nitrate_folder/sunav2" "$parent_dir/sunav2"
        fi
        # Remove empty nitrate folder
        rmdir "$nitrate_folder" 2>/dev/null || true
      fi
    done

    #run second module - fdom corrector
    Rscript ./flow.wq.fdom.corr.R \
      DirIn=/tmp/filterjoined \
      DirOut=/pfs/out \
      DirErr=/pfs/out/errored_datums \
      "DirSubCopy=exo2|exo2dissolvedoxygen|exo2conductivity|exo2phorp|exo2turbidity"
    
    EOF
  env:
    # Environment variables for filter-joiner.
    CONFIG: |
      ---
      # In Pachyderm root will be index 0, 'pfs' index 1, and the repo name index 2.
      # Metadata indices will typically begin at index 3.
      # Use unix-style glob pattern to select the desired directories in each repo 
      input_paths:
        - path:
            name: EXO2_DATA
            glob_pattern: /pfs/EXO2_DATA/*/*/*/water-quality_*/**
            join_indices: [3,4,5,6]
            empty_files: true
        - path:
            name: SUNA_DATA
            glob_pattern: /pfs/SUNA_DATA/*/*/*/water-quality_*/*/sunav2/**
            join_indices: [3,4,5,6]
            empty_files: true
        
    OUT_PATH_1: /tmp/filterjoined # Transfered to OUT_PATH for the first module
    RELATIVE_PATH_INDEX: "3" # Start from year to preserve Y/M/D structure
    LINK_TYPE: COPY # options are COPY or SYMLINK. Use COPY for combined modules. Also shared with 2nd & 3rd modules 
    LOG_LEVEL: DEBUG # Shared among all modules
    
input:
  join:
  - pfs:
      name: EXO2_DATA
      repo: waterQuality_analyze_pad_and_qaqc_plau
      glob: /(*)/(*)/(*)/(*)/
      joinOn: $1/$2/$3/$4
      empty_files: false
  - pfs:
      name: SUNA_DATA
      repo: waterQuality_group_path
      glob: /(*)/(*)/(*)/(*)/
      joinOn: $1/$2/$3/$4
      empty_files: false
parallelism_spec:
  constant: 5
autoscaling: true
resource_requests:
  memory: 1.5G
  cpu: 2.2
resource_limits:
  memory: 3G
  cpu: 3.5
sidecar_resource_requests:
  memory: 3G
  cpu: 0.5
datum_set_spec:
  number: 500
scheduling_spec:
  node_selector:
    cloud.google.com/compute-class: pach-pipeline-class